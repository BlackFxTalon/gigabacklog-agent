[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gigabacklog-agent"
version = "0.1.0"
description = "A controlled GigaChat agent for initial service-request processing"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "gigachat @ git+https://github.com/ai-forever/gigachat.git@0b694b35d017763086a4a72e2609479e1cdee687",
    "langgraph==1.2.10",
    "pydantic>=2.13,<3",
    "typing-extensions>=4.16,<5",
]

[project.scripts]
gigabacklog = "gigabacklog_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gigabacklog_agent"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "integration: opt-in tests that call the live GigaChat API",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
